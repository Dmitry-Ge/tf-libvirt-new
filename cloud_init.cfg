#cloud-config

users:
  - name: dmitryg
    gecos: Dmitry Gerasimov
    lock-passwd: false
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    passwd: $6$rounds=4096$.qP9LKY90weoeg$vsF.KLRgTuBe4BR/Udtq2bTXeF9orMGitTC8T8p93OsJuWDKJmomyWd4AWZChoESBZpa7kj1w6NWmKScg3mHl0
    ssh_authorized_keys:
      - ssh-rsa  dmitryg@wwl-dmitryg

# mkpasswd --method=SHA-512 --rounds=4096

# Enable cloud-init modules
cloud_config_modules:
  - resolv_conf
  - runcmd
  - timezone
  - package-update-upgrade-install

timezone: Europe/Moscow

manage_resolv_conf: true

resolv_conf:
  nameservers: ['192.168.109.3']

# Update/Upgrade & Reboot if necessary
package_update: false
package_upgrade: false
package_reboot_if_required: true

packages:
  - git
  - qemu-guest-agent
  - qemu-guest-agent

# runcmd:
#  - set enforce 0 sestatus
#  - sed -i 's/SELINUX=enforcing/SELINUX=disabled/g' /etc/sysconfig/selinux
#  - yum -y remove cloud-init
#  - systemctl enable qemu-guest-agent.service && systemctl start qemu-guest-agent.service

# Configure where output will go
output:
  all: ">> /var/log/cloud-init.log"

final_message: "The system is finally up, after $UPTIME seconds"
